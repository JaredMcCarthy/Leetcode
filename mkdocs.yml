# ============================================
# mkdocs.yml - Configuración actualizada
# ============================================

site_name: Soluciones LeetCode
site_description: La colección más grande de soluciones a problemas de LeetCode en español
site_author: Jared McCarthy
site_url: https://jaredmccarthy.github.io/Leetcode

# GitHub repo - ACTUALIZADO
repo_name: JaredMcCarthy/Leetcode
repo_url: https://github.com/JaredMcCarthy/Leetcode
edit_uri: edit/main/docs/

# Tema Material
theme:
  name: material
  language: es

  # Logo (opcional, puedes comentarlo si no tienes logo)
  # logo: assets/logo.png
  # favicon: assets/favicon.png

  # Paleta de colores
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  # Fuentes
  font:
    text: Roboto
    code: Roboto Mono

  # Features
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

# Navegación - SIMPLIFICADA (sin archivos que no existen)
nav:
  - Inicio: index.md
  - Problemas: problemas/index.md
  - Contribuir: contribute.md

# Extensiones de Markdown
markdown_extensions:
  # Sintaxis de código
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

  # Tabs para múltiples lenguajes
  - pymdownx.tabbed:
      alternate_style: true

  # Emojis
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator:
        !!python/name:material.extensions.emoji.to_svg # Cajas de nota/advertencia


  - admonition
  - pymdownx.details

  # Listas de tareas
  - pymdownx.tasklist:
      custom_checkbox: true

  # Formato especial
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys

  # Tablas y definiciones
  - tables
  - def_list
  - attr_list
  - md_in_html

  # Links y footnotes
  - footnotes

# CSS personalizado
extra_css:
  - stylesheets/extra.css

# Plugins
plugins:
  - search:
      lang: es

# Extra - TUS REDES SOCIALES
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JaredMcCarthy
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jared-lopez-48b9a137a/
      name: LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:jaredlopezdev@yahoo.com
      name: Email

